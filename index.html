.b-cafe{background:linear-gradient(160deg,#3A2415,#5A3820 40%,#46291A 65%,#3A2415);background-size:300% 300%;animation:flow 13s ease-in-out infinite alternate;--fg:var(--cream);--ink2:rgba(255,243,228,.78);--ic:var(--bt);--line:rgba(255,243,228,.2);--card:#4E3320;--chip:#5C3E28;color:var(--cream)}
@keyframes flow{from{background-position:0% 0%}to{background-position:100% 100%}}
.blob{position:absolute;border-radius:50%;filter:blur(46px);animation:drift 9s ease-in-out infinite alternate}
.blob.a{width:62vmin;height:62vmin;left:-16%;top:4%}
.blob.b{width:54vmin;height:54vmin;right:-18%;top:46%;animation-duration:12s;animation-delay:-4s}
.b-cream .blob.a{background:#F9C9A0;opacity:.6}.b-cream .blob.b{background:#FBE0C4;opacity:.9}
.b-sand .blob.a{background:#F9C9A0;opacity:.45}.b-sand .blob.b{background:#FFF3E4;opacity:.7}
.b-or .blob.a{background:#F9C9A0;opacity:.5}.b-or .blob.b{background:#EE8A52;opacity:.5}
.b-bt .blob.a{background:#FFF3E4;opacity:.55}.b-bt .blob.b{background:#FFD772;opacity:.6}
.b-cafe .blob.a{background:#F2955E;opacity:.22}.b-cafe .blob.b{background:#FFE49A;opacity:.1}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18vmin,-14vmin) scale(1.3)}100%{transform:translate(-14vmin,16vmin) scale(.85)}}

/* ---------- tipografia ---------- */
.h{font-family:var(--head);font-weight:300;font-size:clamp(27px,7.6vw,32px);line-height:1.12;letter-spacing:-.025em}
.h .b{font-weight:700}
.hd{margin-bottom:24px}
.kick{display:block;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:600;color:var(--fg);opacity:.72;margin-bottom:10px}
.sub{margin-top:4px;font-size:15px;line-height:1.45;color:var(--ink2);max-width:480px}
.sub b,.name b{font-weight:700}
.note{font-size:12.5px;line-height:1.45;color:var(--ink2);margin-top:10px}
.fine{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.4}

/* ---------- botões: pílula cheia ---------- */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:11px;width:100%;min-height:52px;padding:12px 24px;border-radius:99px;font-family:var(--head);font-weight:500;font-size:15.5px;line-height:1.15;text-align:left;overflow:hidden;
background:var(--cafe);color:var(--cream);box-shadow:inset 0 1px 0 rgba(255,243,228,.28),inset 0 -10px 18px rgba(255,243,228,.05);animation:breathe 3.8s ease-in-out infinite;transition:transform .2s}
.btn:active{transform:scale(.98)}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,243,228,.22) 50%,transparent 65%);transform:translateX(-130%);animation:sheen 4.2s ease-in-out infinite}
.btn i{font-size:23px;flex:none}
.btn span{flex:1;text-align:left}
.btn small{display:block;font-family:var(--body);font-weight:400;font-size:12.5px;opacity:.85;margin-top:2px}
.btn.or{background:var(--or);color:var(--cafe);box-shadow:inset 0 1px 0 rgba(255,243,228,.5),inset 0 -10px 18px rgba(255,243,228,.1)}
.btn.or::before{background:linear-gradient(105deg,transparent 35%,rgba(255,243,228,.4) 50%,transparent 65%)}
.btn.bt{background:var(--bt);color:var(--cafe);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -10px 18px rgba(255,243,228,.2)}
.btn.bt::before{background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%)}
.btn.sm{width:auto;min-height:44px;padding:9px 20px;font-size:14px;display:inline-flex}
.btn.big{min-height:60px}
.b-cafe .btn:not(.or):not(.bt){background:var(--bt);color:var(--cafe);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.b-cafe .btn:not(.or):not(.bt)::before{background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%)}
.b-or .btn.or{background:var(--cafe);color:var(--cream)}
.b-bt .btn.bt{background:var(--cafe);color:var(--cream)}
.btn.line{background:transparent;color:inherit;border:1.3px solid currentColor;box-shadow:none;min-height:44px;font-size:14px;animation:none}
.btn.line::before{display:none}
@keyframes sheen{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes breathe{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.08) saturate(1.1)}}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- abertura ---------- */
#open{position:fixed;inset:0;z-index:100;overflow:hidden;touch-action:manipulation;cursor:pointer;transition:opacity .9s}
#open.gone{opacity:0;pointer-events:none}
#sky{position:absolute;inset:0;background:linear-gradient(180deg,#FFE49A 0%,#FDD9A2 50%,#F9C9A0 100%);transition:opacity 2.4s}
#sky2,#sky3,#sky4{position:absolute;inset:0;opacity:0;transition:opacity 2.4s}
#sky2{background:linear-gradient(180deg,#F9C9A0 0%,#F5AD7C 55%,#F2955E 100%)}
#sky3{background:linear-gradient(180deg,#E28A5C 0%,#B96A47 55%,#7A4A33 100%)}
#sky4{background:#3A2415}
#open.s1 #sky2{opacity:1}#open.s2 #sky3{opacity:1}#open.s3 #sky4{opacity:1}
#sea{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,rgba(122,74,51,.35),#3A2415);overflow:hidden}
#sea i{position:absolute;left:-10%;width:120%;height:2px;background:rgba(255,243,228,.45);animation:wave 5s linear infinite}
@keyframes wave{to{transform:translateX(10%)}}
#osun{position:absolute;left:50%;width:34vmin;height:34vmin;margin-left:-17vmin;border-radius:50%;bottom:64%;background:radial-gradient(circle,#FFF3E4,#FFE49A 55%,#FBD27A);transition:bottom 2.6s cubic-bezier(.5,0,.3,1),opacity 2s}
#open.s2 #osun{bottom:20%}
#open.s3 #osun{bottom:14%;opacity:.25}
#okite{position:absolute;left:50%;bottom:14%;width:24vmin;margin-left:-12vmin;transition:bottom 2.2s cubic-bezier(.3,0,.2,1),transform 2.2s,opacity .8s;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
#open.s1 #okite{bottom:70%;transform:scale(1.1)}
#open.s2 #okite{bottom:74%;transform:translateX(24vmin) rotate(14deg) scale(.85)}
#open.s3 #okite{opacity:0}
@keyframes sway{0%,100%{rotate:-6deg}50%{rotate:6deg}}
#open .cc{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 28px;z-index:3;color:var(--cafe);transition:color 1.6s}
#open.s2 .cc,#open.s3 .cc{color:var(--cream)}
#open .cc img,#open .cc svg.lg{width:min(250px,64vw);margin:0 auto 14px;display:block;height:auto}
#open .cc svg.lg-c{display:none}#open.s2 .cc svg.lg-c,#open.s3 .cc svg.lg-c{display:block}#open.s2 .cc svg.lg-k,#open.s3 .cc svg.lg-k{display:none}
#open .cc .h{font-size:clamp(26px,7.4vw,32px)}
#open .cc p{margin-top:4px;font-size:15px;opacity:.9}
#open .tap{margin:18px auto 0;display:inline-flex;gap:9px;align-items:center;padding:13px 24px;border-radius:99px;background:var(--cafe);color:var(--cream);font-family:var(--head);font-weight:500;font-size:14.5px;box-shadow:inset 0 1px 0 rgba(255,243,228,.28);animation:breathe 2.6s infinite}
#open.s2 .tap,#open.s3 .tap{background:var(--bt);color:var(--cafe)}
#open .tap i{font-size:21px;animation:hop 1.8s infinite}
@keyframes hop{0%,86%,100%{transform:translateY(0)}92%{transform:translateY(-4px)}}
#skip{position:fixed;top:12px;left:14px;z-index:130;padding:10px 18px;border-radius:99px;background:var(--cafe);color:var(--cream);font-family:var(--head);font-weight:500;font-size:13px;box-shadow:inset 0 1px 0 rgba(255,243,228,.28)}
#cloud1,#cloud2{position:absolute;height:30px;border-radius:99px;background:rgba(255,243,228,.6);filter:blur(7px);animation:cl 42s linear infinite}
#cloud1{width:40vw;top:16%;left:-40vw}#cloud2{width:30vw;top:28%;left:-30vw;animation-duration:58s;animation-delay:-22s}
@keyframes cl{to{transform:translateX(160vw)}}

/* ---------- idioma: pílula própria, fixa no topo ---------- */
#lang{position:fixed;z-index:140;top:12px;right:14px;display:flex;padding:3px;border-radius:99px;background:var(--cream);border:1px solid rgba(58,36,21,.14)}
#lang button{position:relative;z-index:1;min-width:40px;padding:6px 10px;font-family:var(--head);font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--cafe);transition:color .3s}
#lang button.on{color:var(--cream)}
#lang .ind{position:absolute;top:3px;bottom:3px;left:3px;width:40px;border-radius:99px;background:var(--cafe);transition:transform .45s cubic-bezier(.3,1.5,.5,1),width .3s}

/* ---------- menu flutuante ---------- */
#nav{position:fixed;z-index:60;top:64px;left:50%;width:min(432px,calc(100vw - 24px));display:flex;justify-content:space-around;padding:6px 6px 5px;border-radius:99px;background:rgba(255,243,228,.97);border:1px solid rgba(58,36,21,.1);transform:translate(-50%,-140%);transition:transform .7s cubic-bezier(.2,.9,.3,1)}
#nav.on{transform:translate(-50%,0)}
#nav .lk{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px;font-size:9.5px;font-weight:600;color:rgba(58,36,21,.7);letter-spacing:.01em;transition:color .3s}
#nav .lk i{width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;font-size:22px;color:var(--cafe);transition:background .35s,color .35s,transform .35s}
#nav .lk.on{color:var(--cafe)}
#nav .lk.on i{background:var(--cafe);color:var(--cream);transform:translateY(-1px) scale(1.05)}
#navbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:150;pointer-events:none}
#navbar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bt),var(--or))}

/* ---------- primeira página ---------- */
#links{padding-top:128px}
.brand{display:block;width:min(240px,62vw);margin:0 0 6px}
.brand svg{width:100%;height:auto;display:block}
.lcards{display:grid;gap:12px;margin-top:22px}
.lc{position:relative;display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:var(--r);overflow:hidden;color:var(--cafe);text-align:left;width:100%;transition:transform .25s}
.lc:active{transform:scale(.985)}
.lc::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,243,228,.4) 50%,transparent 65%);transform:translateX(-130%);animation:sheen 4.6s ease-in-out infinite}
.lc i{font-size:32px;flex:none}
.lc b{display:block;font-family:var(--head);font-weight:600;font-size:19px;line-height:1.1}
.lc small{display:block;font-size:13px;margin-top:3px;line-height:1.3;opacity:.85}
.lc .go{font-size:20px;margin-left:auto;opacity:.7}
.lc.c1{background:var(--or)}.lc.c2{background:var(--bt)}.lc.c3{background:var(--peach)}.lc.c4{background:var(--sand)}
.lc.c1,.lc.c2,.lc.c3,.lc.c4{box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.biog{display:none;grid-template-columns:1fr 1fr;gap:10px}
.biog.on{display:grid}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;gap:7px;align-items:center;padding:10px 16px;border-radius:99px;background:var(--chip,var(--peach));color:var(--cafe);font-family:var(--head);font-weight:500;font-size:13.5px;transition:background .3s,color .3s}
.chip i{font-size:18px}
.chip.on{background:var(--cafe);color:var(--cream)}
.b-cafe .chip{color:var(--cream)}
.b-cafe .chip.on{background:var(--bt);color:var(--cafe)}

/* ---------- faixa de fotos (formas alternadas) ---------- */
.ribbon{margin:34px calc(var(--pad)*-1) 0;overflow:hidden;contain:paint}
.ribbon .tk{display:flex;gap:10px;width:max-content;animation:mq 46s linear infinite;padding-left:10px}
.ribbon figure{width:128px;height:170px;border-radius:64px 64px 16px 16px;overflow:hidden;flex:none}
.ribbon figure:nth-child(even){border-radius:16px 16px 64px 64px;margin-top:18px;height:150px}
.ribbon img{width:100%;height:100%;object-fit:cover}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- arcos ---------- */
.arc,.arc2{overflow:hidden;position:relative;background:var(--sand)}
.arc{border-radius:130px 130px 24px 24px}
.arc2{border-radius:24px 24px 24px 130px}
.arc img,.arc2 img{width:100%;height:100%;object-fit:cover}
.kenb img{animation:kenb 16s ease-in-out infinite alternate}
@keyframes kenb{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
.bigimg{width:100%;height:300px;margin-bottom:14px}

/* ---------- cartões ---------- */
.card{border-radius:var(--r);background:var(--card);color:var(--cafe);padding:20px;position:relative;overflow:hidden}
.b-cafe .card{color:var(--cream)}
.lbl{display:block;font-family:var(--head);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:8px}

/* ---------- calendário ---------- */
.cal{padding:16px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh button{width:42px;height:42px;border-radius:50%;background:var(--cafe);color:var(--cream);font-size:20px;display:grid;place-items:center}
.calh strong{font-family:var(--head);font-size:21px;font-weight:600}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow span{text-align:center;font-size:11px;font-weight:700;opacity:.5;padding:4px 0}
.days button{aspect-ratio:1;border-radius:50%;font-weight:600;font-size:15px;position:relative;transition:background .2s,color .2s}
.days button:disabled{opacity:.25;cursor:default}
.days button.inr{background:rgba(242,149,94,.35);border-radius:0}
.days button.st,.days button.en{background:var(--cafe);color:var(--cream);border-radius:50%}
.days button.hol::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--or)}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 2px}
.sum div{padding:10px 6px;border-radius:16px;background:rgba(58,36,21,.07);text-align:center}
.sum b{display:block;font-family:var(--head);font-size:19px;font-weight:600;line-height:1.1}
.sum span{font-size:11px;opacity:.7;font-weight:600}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-weight:600}
.step .q{display:flex;align-items:center;gap:12px}
.step .q button{width:38px;height:38px;border-radius:50%;background:var(--cafe);color:var(--cream);font-size:18px;display:grid;place-items:center}
.step .q b{min-width:22px;text-align:center;font-family:var(--head);font-size:19px;font-weight:600}
.catpick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cp{border-radius:22px;overflow:hidden;background:var(--cream);text-align:left;position:relative;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .3s,transform .3s;color:var(--cafe)}
.cp img{width:100%;height:96px;object-fit:cover;border-radius:22px 22px 40px 22px}
.cp div{padding:8px 11px 11px}
.cp b{display:block;font-family:var(--head);font-weight:600;font-size:16px;line-height:1.1}
.cp small{font-size:12px;opacity:.78;line-height:1.25;display:block;margin-top:2px}
.cp.on{outline-color:var(--cafe);transform:translateY(-2px)}
.cp.on::after{content:"";position:absolute;top:9px;right:9px;width:14px;height:14px;border-radius:50%;background:var(--or);border:2px solid var(--cream)}
.warn{padding:11px 14px;border-radius:16px;background:var(--cafe);color:var(--bt);font-weight:600;font-size:13.5px;margin-top:10px}
.cartx{display:grid;grid-template-columns:86px 1fr;gap:12px;background:var(--card);border-radius:22px;padding:10px;margin-bottom:10px;align-items:center;color:var(--cafe)}
.cartx img{width:86px;height:86px;object-fit:cover;border-radius:50px 50px 14px 14px}
.cartx b{font-family:var(--head);font-weight:600;font-size:18px;line-height:1.1;display:block}
.cartx small{display:block;font-size:12.5px;opacity:.75;line-height:1.2;margin:2px 0 7px}
.cartx .q{display:flex;align-items:center;gap:9px}
.cartx .q button{width:32px;height:32px;border-radius:50%;background:var(--cafe);color:var(--cream);display:grid;place-items:center;font-size:16px}
.cartx .q b{font-family:var(--body);font-size:15px;min-width:18px;text-align:center;font-weight:700}
.cartx .q em{font-style:normal;margin-left:auto;font-weight:700;font-size:13.5px}

/* ---------- mesa / puff ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:99px;background:rgba(58,36,21,.1);margin-bottom:14px}
.seg button{padding:12px;border-radius:99px;font-family:var(--head);font-weight:600;font-size:15px;transition:all .3s}
.seg button.on{background:var(--cafe);color:var(--cream)}
.date-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.date-strip::-webkit-scrollbar{display:none}
.dd{flex:none;width:60px;padding:10px 0;border-radius:22px;text-align:center;background:var(--sand);color:var(--cafe);font-weight:700;line-height:1.1}
.dd small{display:block;font-size:11px;opacity:.75;font-weight:600}
.dd b{font-family:var(--head);font-size:22px;display:block;font-weight:600}
.dd.on{background:var(--cafe);color:var(--cream)}
.dd:disabled{opacity:.3}
.map{position:relative;height:300px;border-radius:130px 130px 24px 24px;background:#FBE0C4;overflow:hidden}
.map .sea{position:absolute;left:0;right:0;top:0;height:32%;background:linear-gradient(180deg,#C9DEDD,#AECFCF);overflow:hidden}
.map .sea i{position:absolute;left:-10%;width:120%;height:2px;background:rgba(255,243,228,.7);animation:wave 6s linear infinite}
.map .sand{position:absolute;left:0;right:0;top:32%;bottom:0;background:linear-gradient(180deg,#F8D9B2,#F2C79A)}
.tb{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;font-family:var(--head);font-weight:600;font-size:12.5px;color:var(--cafe);background:var(--or);display:grid;place-items:center;transition:transform .25s;box-shadow:inset 0 1px 0 rgba(255,243,228,.5)}
.tb.puff{border-radius:16px;background:var(--cafe);color:var(--cream)}
.tb.sel{transform:scale(1.28);background:var(--bt);color:var(--cafe);outline:2.5px solid var(--cafe);animation:breathe 1.8s infinite}

/* ---------- quartos ---------- */
.room{border-radius:30px;background:var(--card);color:var(--cafe);margin-bottom:18px;padding:12px 12px 20px;position:relative}
.gal{position:relative;overflow:hidden;border-radius:120px 120px 22px 22px}
.room:nth-of-type(even) .gal{border-radius:22px 22px 22px 120px}
.gal .tr{display:flex;transition:transform .55s cubic-bezier(.3,.8,.3,1);touch-action:pan-y}
.gal .tr img{flex:0 0 100%;width:100%;height:300px;object-fit:cover}
.gal .dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.gal .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,243,228,.6);transition:all .3s}
.gal .dots i.on{width:22px;border-radius:5px;background:var(--cream)}
.gal .nx,.gal .pv{position:absolute;top:55%;margin-top:-21px;width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--cafe);display:grid;place-items:center;font-size:20px}
.gal .nx{right:10px}.gal .pv{left:10px}
.room .in{padding:18px 10px 0}
.room h3{font-family:var(--head);font-weight:300;font-size:28px;line-height:1.08;letter-spacing:-.02em}
.room h3 .b{font-weight:700}
.room p{margin-top:4px;font-size:15px;line-height:1.4;color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.tags span{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border-radius:99px;background:var(--peach);font-size:12.5px;font-weight:600}
.tags i{font-size:16px}
.price{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 14px;color:var(--ink2)}
.price b{font-family:var(--head);font-weight:600;font-size:24px;color:var(--cafe)}

/* ---------- pôr do sol ---------- */
.slides{position:relative;aspect-ratio:4/4.8;border-radius:150px 150px 26px 26px;overflow:hidden;background:var(--cafe2)}
.slides .sl{position:absolute;inset:0;opacity:0;transition:opacity 1.3s}
.slides .sl.on{opacity:1}
.slides .sl img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 8s ease-out}
.slides .sl.on img{transform:scale(1.2) translate(-1.5%,-1%)}

#cartbtn{position:fixed;right:16px;bottom:18px;z-index:70;display:none;align-items:center;gap:9px;padding:14px 20px;border-radius:99px;font-family:var(--head);font-weight:600;color:var(--cream);background:var(--cafe);box-shadow:inset 0 1px 0 rgba(255,243,228,.3);animation:breathe 2.6s infinite;border:1px solid rgba(255,243,228,.25)}

@keyframes kdrift{0%{transform:translateX(-30vw) scaleX(1)}49.9%{transform:translateX(30vw) scaleX(1)}50%{transform:translateX(30vw) scaleX(-1)}100%{transform:translateX(-30vw) scaleX(-1)}}

function sunCalc(m){const t=T();const d=new Date(2027,m,15);const n=dayN(d);const dec=-23.44*Math.cos(2*Math.PI/365*(n+10));const lat=-2.9*Math.PI/180,de=dec*Math.PI/180;
 const H=Math.acos((Math.sin(-0.833*Math.PI/180)-Math.sin(lat)*Math.sin(de))/(Math.cos(lat)*Math.cos(de)))*180/Math.PI;
 const B=2*Math.PI*(n-81)/364,eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
 const noon=12*60-4*(-41.41-(-45))-eot;const set=noon+H*4;const hh=Math.floor(set/60),mm=Math.round(set%60);
 const az=360-Math.acos(Math.sin(de)/Math.cos(lat))*180/Math.PI;return{time:`${hh}h${String(mm).padStart(2,'0')}`,az};}

/* ---------- boot ---------- */
function boot(){
 $('#open').innerHTML=opening();
 $('#lang').innerHTML=['pt','en','es'].map(l=>`<button data-l="${l}" class="${S.lang==l?'on':''}">${l.toUpperCase()}</button>`).join('')+'<span class="ind"></span>';
 render();placeInd($('#lang'));
 const op=$('#open');let st=0;document.body.style.overflow='hidden';
 const done=()=>{op.classList.add('gone');document.body.style.overflow='';$('#nav').classList.add('on');const sk=$('#skip');if(sk)sk.remove();setTimeout(()=>op.remove(),1000)};
 const enter=()=>{op.classList.add('s3');setTimeout(()=>{window.scrollTo(0,0);done()},900)};
 const step=()=>{st++;const t=T();if(st==1){op.classList.add('s1');$('#optxt').textContent=t.tap2}else if(st==2){op.classList.add('s2');$('.tap',op).style.visibility='hidden';setTimeout(enter,2200)}};
 $('#skip').addEventListener('click',e=>{e.stopPropagation();done()});
 op.addEventListener('click',e=>{if(st>=2)return;step()});
 op.addEventListener('pointermove',e=>{const k=$('#okite');if(k&&st==0)k.style.translate=((e.clientX/innerWidth-.5)*18)+'vmin 0'});
 placeInd($('#lang'));
}
document.fonts&&document.fonts.ready.then(()=>placeInd($('#lang')));
boot();
